<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#1c2443">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Paper Plane</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
      /* Игра на всё окно; экран загрузки — значок, название и полоска.
         Выделение текста выключено только у слоёв страницы: окна «скопировать» и «вставить» (KitWeb.jslib)
         лежат прямо в body, и на iPhone поле под запретом выделения не дало бы себя править. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c2443;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #game, #loader, #fs, #rotate { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1c2443; outline: none;
        touch-action: none; }
      #loader, #fs, #rotate { position: fixed; inset: 0; align-items: center; justify-content: center;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #f6eeda; }
      #loader { display: flex; gap: 34px; background: radial-gradient(ellipse at center, #2b3766 0%, #1c2443 72%);
        transition: opacity .45s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader img { width: 176px; height: 176px; transform: rotate(-5deg); filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
        animation: tick 2.2s ease-in-out infinite; }
      #loader-text { display: flex; flex-direction: column; gap: 16px; width: min(440px, 52vw); }
      #loader h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: .5px; }
      #bar { height: 18px; border-radius: 10px; background: #111830; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
      #fill { width: 0%; height: 100%; border-radius: 10px; background: linear-gradient(90deg, #e9b63a, #f4c64e); transition: width .2s; }
      #hint { font-size: 15px; line-height: 1.35; opacity: .8; min-height: 20px; }
      #error { display: none; padding: 12px 16px; border-radius: 10px; background: #7a2f3a; font-size: 15px; line-height: 1.35;
        -webkit-user-select: text; user-select: text; }
      @keyframes tick { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(-2deg) translateY(-6px); } }
      /* узкое окно (телефон стоя до поворота, маленькое окно на компьютере) — столбиком */
      @media (max-width: 620px) { #loader { flex-direction: column; gap: 20px; } #loader-text { width: 78vw; align-items: stretch; }
        #loader h1 { text-align: center; font-size: 36px; } #hint { text-align: center; } #loader img { width: 132px; height: 132px; } }
      /* телефон лёжа: высоты мало */
      @media (max-height: 460px) { #loader img { width: 124px; height: 124px; } #loader h1 { font-size: 34px; } #loader-text { gap: 12px; } }

      /* телефон: после загрузки — «играть на весь экран» (адресная строка съедает и без того низкий экран) */
      #fs { display: none; flex-direction: column; gap: 14px; background: rgba(28, 36, 67, .97); }
      #fs button { font: inherit; font-size: 22px; font-weight: 800; color: #27345e; background: #f4c64e; border: 0; border-radius: 14px;
        padding: 16px 34px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
      #fs a { font-size: 17px; color: #f6eeda; opacity: .85; text-decoration: underline; padding: 10px 18px; }
      #fs p { margin: 0; max-width: 560px; font-size: 15px; line-height: 1.35; opacity: .8; text-align: center; padding: 0 24px; }

      /* телефон стоя: игра альбомная — просим повернуть (в полном экране страница ложится сама) */
      #rotate { display: none; flex-direction: column; gap: 22px; background: #1c2443; z-index: 40; text-align: center; }
      #rotate p { margin: 0; font-size: 20px; font-weight: 700; padding: 0 28px; }
      #rotate .phone { width: 64px; height: 112px; border: 5px solid #f6eeda; border-radius: 14px; box-sizing: border-box;
        animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loader">
      <img src="TemplateData/icon.png" alt="">
      <div id="loader-text">
        <h1>Paper Plane</h1>
        <div id="bar"><div id="fill"></div></div>
        <div id="hint"></div>
        <div id="error"></div>
      </div>
    </div>
    <div id="fs">
      <button id="fs-go"></button>
      <p id="fs-hint"></p>
      <a id="fs-skip" href="#"></a>
    </div>
    <div id="rotate"><div class="phone"></div><p id="rotate-text"></p></div>
    <script>
      // строки страницы — по языку браузера; в игре язык свой (меню)
      var STR = {
        ru: { load: "Загрузка…", first: "Первый запуск дольше: игра скачивается целиком.", err: "Игра не запустилась: ",
              fs: "Играть на весь экран", fsSkip: "Остаться в окне",
              fsHint: "Телефон держите горизонтально. Выйти из полного экрана — жестом «назад», вернуть его — в меню игры.",
              rotate: "Поверните телефон горизонтально" },
        en: { load: "Loading…", first: "The first launch takes longer: the whole game is downloading.", err: "The game couldn't start: ",
              fs: "Play fullscreen", fsSkip: "Stay in the window",
              fsHint: "Hold your phone sideways. Leave fullscreen with the back gesture; turn it on again in the game menu.",
              rotate: "Turn your phone sideways" }
      };
      var T = STR[(navigator.language || "en").slice(0, 2)] || STR.en;
      // телефон или планшет; iPad с «настольным» сайтом называет себя Mac — его выдаёт сенсорный экран
      var ua = navigator.userAgent || "";
      var mobile = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      if (mobile) document.body.className = "mobile";
      document.documentElement.lang = T === STR.ru ? "ru" : "en";
      document.getElementById("hint").textContent = T.load + " " + T.first;
      document.getElementById("rotate-text").textContent = T.rotate;

      var canvas = document.getElementById("game"), loader = document.getElementById("loader");
      var config = {
        arguments: [],
        dataUrl: "Build/fc70a73f135e855d26ffe2d4fa82e156.data.unityweb",
        frameworkUrl: "Build/d31723e0940518b916761efac78d1459.framework.js.unityweb",
        codeUrl: "Build/bec879a89c976ccd672ecbb38d4e42bf.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Paper Plane",
        productVersion: "0.1.0-w1017.1603",
        autoSyncPersistentDataPath: true,
        // интерфейс — в полной плотности экрана (иначе надписи на телефоне мылятся); цену 3D держит масштаб рендера
        // в настройках графики. Потолок ×3 — для сверхплотных экранов; ?dpr=1.5 — попробовать другую (отладка)
        devicePixelRatio: Math.min(Number(new URLSearchParams(location.search).get("dpr")) || window.devicePixelRatio || 1, 3),
        showBanner: function (msg, type) { if (type === "error") showError(msg); }
      };

      // Связь страницы с игрой (Platform/WebBridge.cs, Assets/_Kit/Plugins/WebGL/KitWeb.jslib):
      //   kitgame.ready — игра поднялась; kitgame.debug — открыта с отладкой (?debug=1);
      //   kitgame.dev("gold 5M") → Promise с ответом — отладочная команда, те же слова, что в панели (docs/DEBUG.md).
      var ow = window.kitgame = { ready: false, debug: false, instance: null, version: config.productVersion, _calls: {}, _next: 1 };
      ow.dev = function (line) {
        return new Promise(function (resolve, reject) {
          if (!ow.instance || !ow.ready) { reject(new Error("game is not ready")); return; }
          if (!ow.debug) { reject(new Error("debug is off: open the page with ?debug=1")); return; }
          var id = ow._next++;
          ow._calls[id] = resolve;
          ow.instance.SendMessage("DevTools", "WebCommand", id + " " + line);
        });
      };
      ow._done = function (id, text) { var done = ow._calls[id]; delete ow._calls[id]; if (done) done(text); };
      ow.onready = function () { started(); };

      // полный экран: только из нажатия игрока; на телефоне — ещё и горизонтально
      function goFullscreen() {
        var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return;
        try {
          var p = req.call(el, { navigationUI: "hide" });
          var lock = function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); };
          if (p && p.then) p.then(lock).catch(function () {}); else lock();
        } catch (e) { }
      }
      function offerFullscreen() {
        var el = document.documentElement;
        if (!mobile || !(el.requestFullscreen || el.webkitRequestFullscreen) || document.fullscreenElement || document.webkitFullscreenElement) return;
        if (new URLSearchParams(location.search).get("fs") === "0") return;   // проверка без окна: не спрашивать
        var fs = document.getElementById("fs");
        document.getElementById("fs-go").textContent = T.fs;
        document.getElementById("fs-hint").textContent = T.fsHint;
        document.getElementById("fs-skip").textContent = T.fsSkip;
        document.getElementById("fs-go").onclick = function () { goFullscreen(); fs.style.display = "none"; canvas.focus(); };
        document.getElementById("fs-skip").onclick = function (e) { e.preventDefault(); fs.style.display = "none"; canvas.focus(); };
        fs.style.display = "flex";
      }

      function showError(msg) {
        var e = document.getElementById("error");
        e.textContent = T.err + msg;
        e.style.display = "block";
        loader.style.display = "flex";
        loader.className = "";
      }

      // экран загрузки уходит, когда игра доложила, что поднялась (комната и интерфейс собраны), а не когда загрузился движок
      var shown = false;
      function started() {
        if (shown) return;
        shown = true;
        loader.className = "done";
        canvas.focus();
        offerFullscreen();
        setTimeout(function () { if (loader.className === "done") loader.style.display = "none"; }, 600);
      }

      var script = document.createElement("script");
      script.src = "Build/ebe9e67e75468f3d9b5b5f9afdf2e135.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
          if (progress >= 0.9) document.getElementById("hint").textContent = T.load;
        }).then(function (instance) {
          ow.instance = instance;
          // игра о старте не доложила (ошибка при запуске) — экран загрузки всё равно убрать: под ним видно, что вышло
          if (ow.ready) started(); else setTimeout(started, 20000);
        }).catch(function (message) { showError(message); });
      };
      script.onerror = function () { showError("loader"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
